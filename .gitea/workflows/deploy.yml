name: Build, Publish & Deploy

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish Package (Gitea + NPM)
    runs-on: self-hosted-pl
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Run automated tests
        run: npm test

      # -------------- PUBLISH DO NPMJS.ORG ----------------
      - name: Setup Node for NPM Registry
        uses: actions/setup-node@v3
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to Native Global Registry
        run: npm publish --access public || echo "Version already published to NPM, skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      # -------------- PUBLISH DO GITEA.7U.PL --------------
      - name: Setup Node for Gitea Packages
        uses: actions/setup-node@v3
        with:
          registry-url: 'https://gitea.7u.pl/api/packages/gkucmierz/npm/'

      - name: Publish to Internal Registry
        run: npm publish || echo "Version already published to Gitea, skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY }}

  deploy-demo:
    name: Deploy Demo Showcase (PL Server)
    runs-on: self-hosted-pl
    needs: publish
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Zero-Downtime Docker Build & Deployment
        run: |
          docker compose -f demo/docker-compose.yml build
          docker compose -f demo/docker-compose.yml up -d --remove-orphans
