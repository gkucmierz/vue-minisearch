name: Build, Dual-Publish & Deploy (vue-minisearch)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    uses: gkucmierz/ci-workflows/.gitea/workflows/publish-package.yml@main
    with:
      runs_on: self-hosted-pl
      run_tests: true
      run_build: true
      build_script: 'build'
      publish_private: true
      publish_npmjs: true
      gitea_owner: 'gkucmierz'
      package_scope: ''
    secrets: inherit

  deploy-demo:
    name: Deploy Demo Showcase (PL Server)
    runs-on: self-hosted-pl
    needs: publish
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Zero-Downtime Docker Build & Deployment
        run: |
          docker compose -f demo/docker-compose.yml build
          docker compose -f demo/docker-compose.yml up -d --remove-orphans
